name: Send booking reminders

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  remind-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Call the demo reminders endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/internal/send-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"

  remind-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Call the pilot reminders endpoint
        env:
          API_URL: ${{ secrets.PILOT_API_URL }}
          CRON_SECRET: ${{ secrets.PILOT_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Pilot secrets are not set, skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/internal/send-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"