name: Send booking reminders

on:
  schedule:
    # ፓይለት: በየ30 ደቂቃ፣ 05:00–18:59 UTC = 08:00–21:59 በኢትዮጵያ ሰዓት
    - cron: "*/30 5-18 * * *"
    # ዲሞ: በየ3 ሰዓት (የ Render ነጻ ሰዓት ለመቆጠብ)
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  remind-demo:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call the demo reminders endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/internal/send-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"

  remind-pilot:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 5-18 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call the pilot reminders endpoint
        env:
          API_URL: ${{ secrets.PILOT_API_URL }}
          CRON_SECRET: ${{ secrets.PILOT_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Pilot secrets are not set, skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/internal/send-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"